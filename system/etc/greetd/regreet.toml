# xynorash greeter — ReGreet (graphical greeter for greetd), themed after the profile README.
# Stylesheet: /etc/greetd/regreet.css   Background: /usr/share/backgrounds/xynorash-edge.png

[background]
path = "/usr/share/backgrounds/xynorash-edge.png"
fit = "Cover"

[appearance]
greeting_msg = "xynogamer"

[GTK]
application_prefer_dark_theme = true
font_name = "JetBrainsMono Nerd Font 13"

[commands]
reboot = ["systemctl", "reboot"]
poweroff = ["systemctl", "poweroff"]

[widget.clock]
format = "%A %d %B  ·  %H:%M"
resolution = "500ms"
label_width = 280
