# Applies at next boot only (zram-generator runs at boot; never resize live).
# 8G disksize (~7.5G cap on 15G RAM) at ~2:1 zstd costs ~4G RAM when full,
# double the old 4G device, so it absorbs pressure before the NVMe swapfile (prio 10).
# Larger than RAM/2 would let swap eat the RAM the game needs and thrash.
[zram0]
zram-size = min(ram / 2, 8192)
compression-algorithm = zstd
swap-priority = 100
