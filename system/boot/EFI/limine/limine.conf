# limine.conf: xyno-arch boot menu
timeout: 5
default_entry: 1
remember_last_entry: no
editor_enabled: no

interface_branding: XYNORASH
interface_branding_colour: 7AA2F7
wallpaper: boot():/EFI/limine/wallpaper.png
wallpaper_style: stretched

# Tokyo Night text colours over a half-transparent dark panel
term_background: 801A1B26
term_foreground: C0CAF5
term_palette: 15161E;F7768E;9ECE6A;E0AF68;7AA2F7;BB9AF7;7DCFFF;A9B1D6
term_palette_bright: 414868;F7768E;9ECE6A;E0AF68;7AA2F7;BB9AF7;7DCFFF;C0CAF5

/CachyOS (bore kernel)
    protocol: efi
    path: boot():/EFI/Linux/cachyos-bore.efi

/CachyOS (bore kernel, fallback image)
    protocol: efi
    path: boot():/EFI/Linux/cachyos-bore-fallback.efi

/CachyOS (previous kernel)
    protocol: efi
    path: boot():/EFI/Linux/cachyos-bore-prev.efi
